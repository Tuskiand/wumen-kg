services:
  neo4j:
    image: neo4j:latest
    container_name: neo4j-gds
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:?Set NEO4J_AUTH in .env}
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: gds.*
      NEO4J_server_directories_import: /import
    volumes:
      - ./data:/data
      - ./logs:/logs
      - ./plugins:/plugins
      - ./backend/neo4j_import:/import
